# ===================================================================
# PulseSquare Enterprise Healthcare Management System (HMS)
# Configuration Properties
# ===================================================================

# Application Info
spring.application.name=pulsesquare-hms
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------
# IBM Db2 Enterprise Database Connection
# -------------------------------------------------------------------
# Default target: IBM Db2 database 'hms', user 'appdata'
# Overridable via environment variables: DB2_HOST, DB2_PORT, DB2_DATABASE, DB2_USERNAME, DB2_PASSWORD
spring.datasource.url=jdbc:db2://${DB2_HOST:localhost}:${DB2_PORT:50000}/${DB2_DATABASE:hms}
spring.datasource.username=${DB2_USERNAME:appdata}
spring.datasource.password=${DB2_PASSWORD:app}
spring.datasource.driver-class-name=com.ibm.db2.jcc.DB2Driver

# Enterprise HikariCP Connection Pool Tuning
spring.datasource.hikari.pool-name=PulseSquare-Db2-HikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.leak-detection-threshold=20000

# Resilient developer fallback flag
pulsesquare.db2.fallback-enabled=true

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Enterprise Actuator & Observability
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# Logging Format
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.pulsesquare=DEBUG
logging.level.com.example=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n