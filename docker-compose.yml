# =============================================================================
# PulseSquare HMS - IBM Db2 Community Edition (Docker)
# =============================================================================
# Usage:
#   Start:   docker-compose up -d
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f db2
#   Connect: docker-compose exec db2 bash -c "su - db2inst1 -c 'db2 connect to hms'"
#
# First-time startup takes ~3-5 minutes for Db2 to initialize.
# Wait until "Setup has completed" appears in the logs before starting the app.
# =============================================================================

version: "3.8"

services:
  db2:
    image: icr.io/db2_community/db2
    container_name: hms-db2
    restart: unless-stopped
    privileged: true
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-app}
      LICENSE: accept
      DBNAME: ${DB2_DATABASE:-hms}
    volumes:
      - hms_db2_data:/database
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to ${DB2_DATABASE:-hms}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  hms_db2_data:
    driver: local
