get:
  tags:
    - Radiology & Medical Imaging
  summary: Search radiology orders and imaging study records
  description: Returns diagnostic imaging studies (X-ray, MRI, CT, Ultrasound), modality types, and PACS accession numbers.
  operationId: listRadiologyOrders
  security:
    - BearerAuth: []
  parameters:
    - name: modality
      in: query
      schema:
        type: string
        example: "CT"
    - name: status
      in: query
      schema:
        type: string
  responses:
    '200':
      description: Radiology studies retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ApiError.yaml'
