# ===================================================================
# PulseSquare Enterprise Healthcare Management System (HMS)
# Enterprise Web Services (hms-ws) Configuration Properties
# Powered by jOOQ Type-safe SQL & IBM Db2
# ===================================================================

# Application Info
spring.application.name=pulsesquare-hms-ws
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------
# IBM Db2 Enterprise Database Connection
# -------------------------------------------------------------------
# Local Dev: Run 'docker-compose up -d' from the project root to start Db2.
# Default credentials match the Docker container (icr.io/db2_community/db2).
# Wait ~3-5 min for first-time container init before starting the app.
# Overridable via environment variables: DB2_HOST, DB2_PORT, DB2_DATABASE, DB2_USERNAME, DB2_PASSWORD
spring.datasource.url=jdbc:db2://${DB2_HOST:localhost}:${DB2_PORT:50000}/${DB2_DATABASE:hms}
spring.datasource.username=${DB2_USERNAME:db2inst1}
spring.datasource.password=${DB2_PASSWORD:app}
spring.datasource.driver-class-name=com.ibm.db2.jcc.DB2Driver

# Enterprise HikariCP Connection Pool Tuning
spring.datasource.hikari.pool-name=PulseSquare-Db2-HikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM SYSIBM.SYSDUMMY1

# -------------------------------------------------------------------
# jOOQ SQL Dialect (Replacing Hibernate ORM - IBM Db2 ANSI Dialect)
# -------------------------------------------------------------------
spring.jooq.sql-dialect=DEFAULT

# -------------------------------------------------------------------
# Flyway Database Migrations (Loaded from hms-db-dist)
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

# -------------------------------------------------------------------
# SpringDoc OpenAPI 3.0 & Swagger UI (HMS Functionalities Only)
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=list
springdoc.show-actuator=false

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
pulsesquare.jwt.secret=${JWT_SECRET:PulseSquareEnterpriseHMSSecretKey2026SecureKeyWithAtLeast256BitsLength!}
pulsesquare.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Enterprise Actuator & Observability (Segregated from Swagger)
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# Logging Format
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.pulsesquare=DEBUG
logging.level.org.jooq=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
